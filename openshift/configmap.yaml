  REACT_APP_HR_EXCHANGE_TEMPLATE_ID: ""
  REACT_APP_BANK_W3_ROOT: ""
  REACT_APP_BANK_CLIENT_ID: ""
  REACT_APP_BANK_CLIENT_SECRET: ""
  REACT_APP_BANK_REDIRECT_URL: ""
