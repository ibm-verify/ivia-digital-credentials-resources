apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-portal
  labels:
    app: hr-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hr-portal
  template:
    metadata:
      labels:
        app: hr-portal
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: isva-vc-repo-dal
      containers:
      - name: hr-portal
        image: hr-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          limits:
            memory: "512Mi"
          requests:
            memory: "256Mi"
        env:
        - name: REACT_APP_ACCOUNT_URL
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_ACCOUNT_URL
        - name: REACT_APP_TOKEN_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_TOKEN_ENDPOINT
        - name: REACT_APP_HR_AGENT_ID
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_HR_AGENT_ID
        - name: REACT_APP_HR_AGENT_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_HR_AGENT_CLIENT_ID
        - name: REACT_APP_HR_AGENT_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_HR_AGENT_PASSWORD
        - name: REACT_APP_HR_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_HR_CLIENT_ID
        - name: REACT_APP_HR_CLIENT_SECRET
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_HR_CLIENT_SECRET
        - name: REACT_APP_HR_W3_ROOT
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_HR_W3_ROOT
        - name: REACT_APP_HR_REDIRECT_URL
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_HR_REDIRECT_URL
        - name: REACT_APP_HR_LOGOUT_REDIRECT_URL
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_HR_LOGOUT_REDIRECT_URL
        - name: REACT_APP_HR_CREDENTIAL_SCHEMA_ID
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_HR_CREDENTIAL_SCHEMA_ID
        - name: REACT_APP_HR_CREDENTIAL_DEFINITION_ID
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_HR_CREDENTIAL_DEFINITION_ID
        - name: HR_LOGOUT_REDIRECT_URL
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: REACT_APP_HR_LOGOUT_REDIRECT_URL
        - name: IBM_VERIFY_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: IBM_VERIFY_BASE_URL
        - name: IBM_VERIFY_TOKEN_URL
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: IBM_VERIFY_TOKEN_URL
        - name: IBM_VERIFY_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: IBM_VERIFY_CLIENT_ID
        - name: IBM_VERIFY_CLIENT_SECRET
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: IBM_VERIFY_CLIENT_SECRET
        - name: IBM_VERIFY_BANK_USERS_GROUP
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: IBM_VERIFY_BANK_USERS_GROUP
        - name: IBM_VERIFY_FIDO2_RELYING_PARTY_ID
          valueFrom:
            configMapKeyRef:
              name: oid4vc-config-hr
              key: IBM_VERIFY_FIDO2_RELYING_PARTY_ID
        volumeMounts:
        - name: webapps-tls
          mountPath: /certs
          readOnly: true
      volumes:
      - name: webapps-tls
        secret:
          secretName: oid4vc-webapps-tls
          items:
          - key: tls.crt
            path: webapps.crt
          - key: tls.key
            path: webapps.key
---
apiVersion: v1
kind: Service
metadata:
  name: hr-portal
spec:
  selector:
    app: hr-portal
  ports:
  - port: 8092
    targetPort: 3000
  type: ClusterIP
